         </nav>   
        <div class="signup-container">
            <h1>Create Account</h1>
            <p>Fill in the form below to join cozy community</p>
            <form id="signupform"novalidate>
                <label for="Full name">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter Your Full Name">
                <small class="error-message" id="FullNameError"></small><br>
                <label for="Email">Email Address</label>
                <input type="email" id="email" placeholder="you@email.com">
                <small class="error-message" id="EmailError"></small><br>
                <label for="password">password</label>
                <input type="password" id="password" placeholder="create a password">
                <small class="error-message" id="passwordError"></small><br>
                <label for="confirmpassword">confirm password</label>
                <input type="password" id="confirmpassword" placeholder="confirm your password">
                <small class="error-message" id="confirmpassworderror"></small><br>
                <label for="phone">phone number</label>
                <input type="tel" id="phone" placeholder="+213...." required>
                <small class="error-message" id="phoneerror"></small><br>
                <label>
                    <input type="checkbox" required> I agree to the Terms and Conditions
                </label><br>
                <button type="submit">Register</button>
                <p id="successmessage"></p>
                <p class="signin-link">already have an account?<br><button type="signin"><a href="signin.html">Sign In</a></button></p>
            </form>
        </div>
    </body>
